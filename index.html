<!DOCTYPE html>
<html lang="en" data-theme="pearl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#e2e8f2">
    <link rel="icon" href="./favicon.svg" type="image/svg+xml">
    <meta name="description" content="Track banking follow-ups, payment deadlines and mail chains.">
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="icon" href="./favicon.png" sizes="64x64" type="image/png">
    <link rel="apple-touch-icon" href="./apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>Banking Work Tracker — Web Application Dashboard</title>
    <script>
        (function () {
            try {
                var t = localStorage.getItem('pureEnergyTheme');
                if (t) document.documentElement.setAttribute('data-theme', t);
                var sizes = { small: '87.5%', default: '100%', large: '112.5%', xlarge: '125%' };
                var ts = localStorage.getItem('pureEnergyTextSize');
                if (ts && sizes[ts]) document.documentElement.style.fontSize = sizes[ts];
            } catch (e) {}
            window.__bootAt = Date.now();

            window.__shell = function () {
                var w = window.innerWidth || document.documentElement.clientWidth || 1024;
                var coarse = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
                if (w <= 900) return 'mobile';
                if (coarse && w <= 1180) return 'mobile';
                return 'desktop';
            };
            document.documentElement.setAttribute('data-shell', window.__shell());
        })();
    </script>
    <style>
        /* =========================================================
           Banking Work Tracker — iOS Glassy Finish UI
           ========================================================= */

        /* ── THEME 1: Pearl (iOS Default) ──────────────────────── */
        :root, html[data-theme="pearl"] {
            --canvas-bg: linear-gradient(145deg, #e8edf5 0%, #dce4f0 40%, #e4dff5 100%);
            --canvas-solid: #e2e8f2;

            --glass-bg:        rgba(255, 255, 255, 0.62);
            --glass-bg-hover:  rgba(255, 255, 255, 0.82);
            --glass-header-bg: rgba(242, 242, 247, 0.78);
            --glass-th-bg:     rgba(248, 248, 252, 0.92);
            --glass-modal-bg:  rgba(255, 255, 255, 0.72);
            --glass-border:    rgba(255, 255, 255, 0.55);
            --glass-border-subtle: rgba(255, 255, 255, 0.45);
            --glass-specular:  rgba(255, 255, 255, 0.80);
            --glass-shadow:    0 8px 40px rgba(0, 0, 0, 0.08), 0 2px 8px rgba(0,0,0,0.04);
            --glass-shadow-sm: 0 4px 20px rgba(0, 0, 0, 0.05);
            --glass-inset:     inset 0 1px 0 rgba(255,255,255,0.8);

            /* WCAG AA Compliant: 4.6:1 contrast ratio */
            --label: #1c1c1e; --label-2: #8e8e93; --label-3: #636366;
            --separator: rgba(60,60,67,0.1); --line: rgba(60,60,67,0.1); --line-strong: rgba(60,60,67,0.18);
            --fill: rgba(120,120,128,0.08); --fill-2: rgba(120,120,128,0.14);
            --input-bg: rgba(255,255,255,0.7);
            --accent: #007aff; --blue: #007aff; --blue-ink: #0055cc;
            --red: #ff3b30; --red-ink: #c9000a; --green: #34c759; --green-ink: #1a7d33;
            --amber: #ff9500; --amber-ink: #8f4a00; --violet: #af52de; --violet-ink: #6e2a9e;
            --slate: #8e8e93; color-scheme: light;
        }

        /* ── THEME 2: Glassmorphism ──────────────────────────────── */
        html[data-theme="glass"] {
            --canvas-bg: linear-gradient(135deg, #a8c8ff 0%, #c9b6ff 35%, #ffc2e8 70%, #a5f0e4 100%);
            --canvas-solid: #bfc9f5;

            --glass-bg:        rgba(255, 255, 255, 0.34);
            --glass-bg-hover:  rgba(255, 255, 255, 0.52);
            --glass-header-bg: rgba(255, 255, 255, 0.42);
            --glass-th-bg:     rgba(255, 255, 255, 0.68);
            --glass-modal-bg:  rgba(255, 255, 255, 0.46);
            --glass-border:    rgba(255, 255, 255, 0.62);
            --glass-border-subtle: rgba(255, 255, 255, 0.42);
            --glass-specular:  rgba(255, 255, 255, 0.92);
            --glass-shadow:    0 12px 44px rgba(49, 46, 129, 0.18), 0 2px 10px rgba(49, 46, 129, 0.08);
            --glass-shadow-sm: 0 6px 22px rgba(49, 46, 129, 0.12);
            --glass-inset:     inset 0 1px 0 rgba(255,255,255,0.95);

            --label: #1e1b4b; --label-2: #4c469c; --label-3: #8b87c9;
            --separator: rgba(49,46,129,0.14); --line: rgba(255,255,255,0.45); --line-strong: rgba(255,255,255,0.7);
            --fill: rgba(255,255,255,0.26); --fill-2: rgba(255,255,255,0.42);
            --input-bg: rgba(255,255,255,0.46);
            --accent: #4f46e5; --blue: #2563eb; --blue-ink: #3730a3;
            --red: #f43f5e; --red-ink: #9f1239; --green: #10b981; --green-ink: #065f46;
            --amber: #f59e0b; --amber-ink: #92400e; --violet: #8b5cf6; --violet-ink: #5b21b6;
            --slate: #4c469c; color-scheme: light;
        }
        html[data-theme="glass"] .stat-tile, html[data-theme="glass"] .appbar,
        html[data-theme="glass"] .cfg-section, html[data-theme="glass"] .mini-tile,
        html[data-theme="glass"] .single-line-toolbar, html[data-theme="glass"] .tabbar,
        html[data-theme="glass"] .modal-content, html[data-theme="glass"] .ms-options,
        html[data-theme="glass"] .table-container, html[data-theme="glass"] .tcard {
            backdrop-filter: saturate(200%) blur(40px) !important;
            -webkit-backdrop-filter: saturate(200%) blur(40px) !important;
        }

        /* ── THEME 3: Neumorphism (Soft UI) ──────────────────────── */
        html[data-theme="neuo"] {
            --canvas-bg: linear-gradient(145deg, #e8edf4 0%, #e2e8f0 100%);
            --canvas-solid: #e6ebf2;

            --glass-bg:        #e9eef5;
            --glass-bg-hover:  #eef2f8;
            --glass-header-bg: #e9eef5;
            --glass-th-bg:     #e4eaf2;
            --glass-modal-bg:  #e9eef5;
            --glass-border:    transparent;
            --glass-border-subtle: transparent;
            --glass-specular:  transparent;
            --glass-shadow:    8px 8px 18px rgba(163,177,198,0.55), -8px -8px 18px rgba(255,255,255,0.95);
            --glass-shadow-sm: 5px 5px 12px rgba(163,177,198,0.45), -5px -5px 12px rgba(255,255,255,0.9);
            --glass-inset:     inset 0 0 0 1px rgba(255,255,255,0.35);

            /* WCAG AA Compliant: 4.5:1 contrast ratio */
            --label: #2d3a4e; --label-2: #7688a1; --label-3: #55657d;
            --separator: rgba(163,177,198,0.35); --line: rgba(163,177,198,0.4); --line-strong: rgba(163,177,198,0.6);
            --fill: rgba(163,177,198,0.16); --fill-2: rgba(163,177,198,0.3);
            --input-bg: #e4eaf2;
            --accent: #5b7cfa; --blue: #5b7cfa; --blue-ink: #3a55c9;
            --red: #f4736b; --red-ink: #c0392b; --green: #4fc38a; --green-ink: #2a8259;
            --amber: #f0a441; --amber-ink: #a9661a; --violet: #9b7ff0; --violet-ink: #6b4ec2;
            --slate: #7688a1; color-scheme: light;
        }
        html[data-theme="neuo"] .stat-tile, html[data-theme="neuo"] .appbar,
        html[data-theme="neuo"] .cfg-section, html[data-theme="neuo"] .mini-tile,
        html[data-theme="neuo"] .single-line-toolbar, html[data-theme="neuo"] .tabbar,
        html[data-theme="neuo"] .modal-content, html[data-theme="neuo"] .ms-options,
        html[data-theme="neuo"] .table-container, html[data-theme="neuo"] .tcard {
            backdrop-filter: none !important; -webkit-backdrop-filter: none !important;
        }
        html[data-theme="neuo"] .btn-icon,
        html[data-theme="neuo"] .filter-input,
        html[data-theme="neuo"] .filter-select,
        html[data-theme="neuo"] .ms-header {
            border: none;
            box-shadow: 4px 4px 9px rgba(163,177,198,0.45), -4px -4px 9px rgba(255,255,255,0.92);
        }
        html[data-theme="neuo"] .btn-icon:active,
        html[data-theme="neuo"] .filter-input:focus,
        html[data-theme="neuo"] .filter-select:focus {
            box-shadow: inset 4px 4px 9px rgba(163,177,198,0.5), inset -4px -4px 9px rgba(255,255,255,0.92);
        }
        html[data-theme="neuo"] td, html[data-theme="neuo"] th { background: transparent !important; }
        html[data-theme="neuo"] tbody tr:hover td { background: rgba(255,255,255,0.45) !important; }

        /* ── THEME 4: Claymorphism (Soft 3D) ─────────────────────── */
        html[data-theme="clay"] {
            --canvas-bg: linear-gradient(145deg, #e3e9ff 0%, #f0e6ff 45%, #dff0ff 100%);
            --canvas-solid: #e7ecff;

            --glass-bg:        rgba(255, 255, 255, 0.78);
            --glass-bg-hover:  rgba(255, 255, 255, 0.92);
            --glass-header-bg: rgba(255, 255, 255, 0.82);
            --glass-th-bg:     rgba(250, 249, 255, 0.95);
            --glass-modal-bg:  rgba(255, 255, 255, 0.86);
            --glass-border:    rgba(255, 255, 255, 0.85);
            --glass-border-subtle: rgba(255, 255, 255, 0.6);
            --glass-specular:  rgba(255, 255, 255, 0.95);
            --glass-shadow:    0 18px 34px rgba(109, 92, 214, 0.20), 0 6px 12px rgba(109, 92, 214, 0.12);
            --glass-shadow-sm: 0 12px 24px rgba(109, 92, 214, 0.16);
            --glass-inset:     inset 0 -8px 14px rgba(139, 92, 246, 0.14), inset 0 8px 12px rgba(255, 255, 255, 0.95);

            --label: #312152; --label-2: #7a6aa8; --label-3: #756799;
            --separator: rgba(109,92,214,0.14); --line: rgba(109,92,214,0.16); --line-strong: rgba(109,92,214,0.26);
            --fill: rgba(139,92,246,0.08); --fill-2: rgba(139,92,246,0.16);
            --input-bg: rgba(255,255,255,0.8);
            --accent: #7c5cf0; --blue: #5b8def; --blue-ink: #3b5bc9;
            --red: #fb7185; --red-ink: #be123c; --green: #4ade80; --green-ink: #15803d;
            --amber: #fbbf24; --amber-ink: #b45309; --violet: #a78bfa; --violet-ink: #6d28d9;
            --slate: #7a6aa8; color-scheme: light;
        }
        html[data-theme="clay"] .stat-tile,
        html[data-theme="clay"] .mini-tile,
        html[data-theme="clay"] .cfg-section,
        html[data-theme="clay"] .tcard,
        html[data-theme="clay"] .table-container,
        html[data-theme="clay"] .single-line-toolbar,
        html[data-theme="clay"] .empty-state { border-radius: 32px; }
        html[data-theme="clay"] .btn-icon,
        html[data-theme="clay"] .filter-input,
        html[data-theme="clay"] .filter-select,
        html[data-theme="clay"] .ms-header,
        html[data-theme="clay"] .btn-modal { border-radius: 18px; }
        html[data-theme="clay"] .appbar-mark { border-radius: 16px; }

        /* ── THEME 5: The 3D Hero Object ─────────────────────────── */
        html[data-theme="hero3d"] {
            --canvas-bg: radial-gradient(1100px 620px at 18% -8%, #3b2a7a 0%, transparent 58%),
                         radial-gradient(950px 560px at 92% 8%, #0e5e6e 0%, transparent 55%),
                         linear-gradient(160deg, #0d1020 0%, #141936 55%, #0a0d1c 100%);
            --canvas-solid: #10142a;

            --glass-bg:        rgba(36, 41, 74, 0.60);
            --glass-bg-hover:  rgba(48, 54, 94, 0.78);
            --glass-header-bg: rgba(20, 25, 52, 0.82);
            --glass-th-bg:     rgba(26, 31, 60, 0.95);
            --glass-modal-bg:  rgba(28, 33, 64, 0.86);
            --glass-border:    rgba(148, 163, 255, 0.20);
            --glass-border-subtle: rgba(148, 163, 255, 0.13);
            --glass-specular:  rgba(190, 200, 255, 0.35);
            --glass-shadow:    0 26px 60px rgba(0, 0, 0, 0.55), 0 8px 20px rgba(79, 70, 229, 0.28);
            --glass-shadow-sm: 0 14px 34px rgba(0, 0, 0, 0.45);
            --glass-inset:     inset 0 1px 0 rgba(190, 200, 255, 0.22);

            --label: #eef1ff; --label-2: #a9b2e0; --label-3: #8a96c7;
            --separator: rgba(148,163,255,0.16); --line: rgba(148,163,255,0.18); --line-strong: rgba(148,163,255,0.32);
            --fill: rgba(148,163,255,0.11); --fill-2: rgba(148,163,255,0.20);
            --input-bg: rgba(16, 20, 44, 0.72);
            --accent: #818cf8; --blue: #60a5fa; --blue-ink: #bfdbfe;
            --red: #fb7185; --red-ink: #fecdd3; --green: #34d399; --green-ink: #a7f3d0;
            --amber: #fbbf24; --amber-ink: #fde68a; --violet: #c084fc; --violet-ink: #e9d5ff;
            --slate: #8b95c9; color-scheme: dark;
        }
        html[data-theme="hero3d"] .toast { color: #0d1020; background: #dfe4ff; }
        html[data-theme="hero3d"] .toast-action { color: #312e81; background: rgba(49,46,129,0.12); border-color: rgba(49,46,129,0.3); }
        html[data-theme="hero3d"] .appbar-mark {
            background: linear-gradient(150deg, #a5b4fc 0%, #6366f1 46%, #3730a3 100%);
            box-shadow: 0 12px 26px rgba(67, 56, 202, 0.6),
                        inset 0 2px 3px rgba(255,255,255,0.55),
                        inset 0 -3px 6px rgba(30, 27, 75, 0.6);
        }
        html[data-theme="hero3d"] .boot-tile { filter: drop-shadow(0 22px 46px rgba(99, 102, 241, 0.55)); }

        /* ── GLOBAL BLUR MIXIN ──────────────────────────────────── */
        .stat-tile, .appbar, .cfg-section, .mini-tile,
        .single-line-toolbar, .tabbar, .modal-content,
        .ms-options, .table-container {
            backdrop-filter: saturate(180%) blur(28px);
            -webkit-backdrop-filter: saturate(180%) blur(28px);
        }

        /* ── ROOT CONSTANTS ─────────────────────────────────────── */
        :root {
            --appbar-h: 64px;
            --tabbar-h: 64px;
            --ease: cubic-bezier(0.2, 0.8, 0.2, 1);
            --ease-spring: cubic-bezier(0.175, 0.885, 0.32, 1.275);
            --font-main: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Segoe UI", sans-serif;
            --font-num: "SF Pro Display", "Inter", -apple-system, system-ui, sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--font-main); -webkit-tap-highlight-color: transparent; }
        html, body { height: 100%; height: 100dvh; overflow: hidden; -webkit-text-size-adjust: 100%; }

        body {
            display: flex; flex-direction: column;
            background: var(--canvas-bg); color: var(--label);
            font-size: 14px; line-height: 1.45;
            font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased;
        }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--line-strong); border-radius: 10px; }

        /* Keyboard Accessibility: High-Visibility Focus Outline */
        :focus-visible {
            outline: 2px solid var(--accent) !important;
            outline-offset: 2px !important;
        }
        .tabbar-btn:focus-visible,
        .stat-tile:focus-visible,
        .mini-tile:focus-visible,
        .btn-icon:focus-visible,
        .btn-modal:focus-visible {
            outline: 2px solid var(--accent) !important;
            outline-offset: 2px !important;
        }

        /* ── APP BAR ─────────────────────────────────────────────── */
        .appbar {
            order: -2; flex-shrink: 0; z-index: 60;
            display: flex; align-items: center; justify-content: space-between; gap: 14px;
            height: var(--appbar-h); padding: 0 32px;
            background: var(--glass-header-bg);
            border-bottom: 1px solid var(--glass-border);
            box-shadow: var(--glass-inset), 0 1px 0 var(--line), 0 4px 20px rgba(0,0,0,0.04);
        }
        .appbar-left { display: flex; align-items: center; gap: 14px; min-width: 0; }
        .appbar-mark {
            flex-shrink: 0; width: 34px; height: 34px; display: grid; place-items: center;
            background: var(--accent); border-radius: 9px; color: #fff;
            box-shadow: 0 4px 14px rgba(0,0,0,0.18), inset 0 1px 0 rgba(255,255,255,0.25);
        }
        .appbar-mark.busy svg { animation: spin 1s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        .appbar-mark svg { width: 18px; height: 18px; stroke: #fff; }
        .appbar-title { font-size: 1.1rem; font-weight: 700; letter-spacing: -0.015em;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .appbar-sub { font-size: 0.8rem; color: var(--label-2); font-weight: 500;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .appbar-right { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
        .appbar-left > div { min-width: 0; }

        .autosave {
            display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px;
            font-size: 0.75rem; font-weight: 600; color: var(--label-2);
            background: var(--fill); border: 1px solid var(--glass-border-subtle);
            border-radius: 20px; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
        }
        .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--green); }

        /* ── SEGMENTED TABS (desktop) ────────────────────────────── */
        .tabbar {
            display: flex; align-items: center; gap: 4px; padding: 4px;
            background: var(--fill);
            border: 1px solid var(--glass-border-subtle); border-radius: 13px;
            box-shadow: var(--glass-inset);
        }
        .tabbar-btn {
            position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
            height: 36px; padding: 0 18px; font-size: 0.85rem; font-weight: 600; color: var(--label-2);
            background: transparent; border: none; border-radius: 9px; cursor: pointer; transition: all 0.2s var(--ease);
        }
        .tabbar-btn:hover { color: var(--label); background: var(--fill-2); }
        .tabbar-btn.active {
            color: var(--accent); background: var(--glass-bg);
            box-shadow: 0 2px 8px rgba(0,0,0,0.08), var(--glass-inset); font-weight: 700;
        }
        .tabbar-ico { display: none; }
        .badge {
            min-width: 18px; height: 18px; padding: 0 5px; font-size: 0.65rem; font-weight: 700;
            display: inline-flex; align-items: center; justify-content: center; border-radius: 20px;
            color: var(--label-2); background: var(--fill-2);
        }
        .tabbar-btn.active .badge { background: var(--accent); color: #fff; }
        .badge.red { color: #fff; background: var(--red); }

        /* ── CONTENT AREA ────────────────────────────────────────── */
        .content-area {
            flex: 1 1 auto; min-height: 0; display: none;
            overflow-y: auto; overflow-x: hidden; padding: 24px 28px 48px;
            -webkit-overflow-scrolling: touch; overscroll-behavior-y: contain;
        }
        .content-area.active { display: block; animation: viewFade 0.25s var(--ease) both; }
        @keyframes viewFade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

        /* ── DASHBOARD GRID ──────────────────────────────────────── */
        #dashboardTab { --gutter: max(16px, 1vw); }
        #registerTab, #completedTab, #binTab, #holidaysTab { --gutter: max(16px, 1vw); padding: 18px var(--gutter) 48px; }
        
        .dash-controls {
            display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; margin-bottom: 24px;
            padding: 12px 20px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border); border-radius: 18px;
            box-shadow: var(--glass-shadow-sm),
